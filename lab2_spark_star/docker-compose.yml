services:
  postgres:
    image: postgres:16-alpine
    container_name: lab2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab2_db
    ports:
      - "5434:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
      - lab2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab2_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lab2_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: lab2_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: user
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8124:8123"
      - "9001:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - lab2_net

  spark-master:
    image: apache/spark:3.5.1
    container_name: lab2_spark_master
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ./scripts:/opt/spark/app:ro
      - ./jars:/opt/spark/drivers:ro
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    networks:
      - lab2_net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: lab2_spark_worker
    restart: unless-stopped
    depends_on:
      - spark-master
    ports:
      - "8083:8081"
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    volumes:
      - ./scripts:/opt/spark/app:ro
      - ./jars:/opt/spark/drivers:ro
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    networks:
      - lab2_net

volumes:
  lab2_postgres_data:

networks:
  lab2_net:
    driver: bridge
